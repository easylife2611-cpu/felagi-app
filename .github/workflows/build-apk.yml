name: Build APK

on:
  push:
    branches:
      - main
      - feature/ai-guided-need-creation
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: mobile/app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile/app
        run: flutter analyze

      - name: Flutter test
        working-directory: mobile/app
        run: flutter test --reporter expanded

      - name: Decode keystore (release only)
        if: github.event.inputs.build_type != 'debug' && github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/app/android/app/upload-keystore.jks
          echo "✅ Keystore decoded"

      - name: Create key.properties (release only)
        if: github.event.inputs.build_type != 'debug' && github.ref_type == 'tag'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > mobile/app/android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          echo "✅ key.properties created"

      - name: Build APK (debug)
        if: github.event.inputs.build_type == 'debug' || github.ref_type != 'tag'
        working-directory: mobile/app
        run: flutter build apk --debug

      - name: Build APK (release, signed)
        if: github.event.inputs.build_type != 'debug' && github.ref_type == 'tag'
        working-directory: mobile/app
        run: flutter build apk --release

      - name: Upload debug APK
        if: github.event.inputs.build_type == 'debug' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: mobile/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: github.event.inputs.build_type != 'debug' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: mobile/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/app/build/app/outputs/flutter-apk/app-release.apk
